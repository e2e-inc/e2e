# Replay recording of one e2e test. Review it like code: each step lists what
# a replay does (do) and what it checks before the step passes (expect).
# Don't edit it: an edited recording no longer replays, and the test records
# nothing until the edit is undone. To record a step again, delete it here.
# Keys and digests: scenarios-act-completes-photo-picker.lock.json

test: act completes Photo Picker
file: tests-agent/scenarios.e2e.ts

steps:
  - act: "Complete this scenario as the screen instructs: choose a photo and pick the most recent one from the library so it is attached as the receipt"
    targets:
      ios-simulator:
        at: dev.e2e.benchmark / Photo Picker
        do:
          - tap: { role: other, name: Choose photo, testId: choose-photo, selector: id=choose-photo }
          - tap: { role: image, name: "Photo, October 15, 10:27", testId: PXGGridLayout-Info, selector: id=PXGGridLayout-Info }
        expect:
          shows:
            - { role: other, name: "Receipt attached: icon.png" }
            - { role: text, name: "Receipt attached: icon.png", testId: success-message }
          gone:
            - { role: text, name: Expense report }
            - { role: text, name: Attach the receipt photo from your photo library to submit this expense. }
            - { role: other, name: Choose photo, testId: choose-photo }
            - { role: other, name: Expense report }
