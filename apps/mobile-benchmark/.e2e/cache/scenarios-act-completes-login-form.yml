# Replay recording of one e2e test. Review it like code: each step lists what
# a replay does (do) and what it checks before the step passes (expect).
# Don't edit it: an edited recording no longer replays, and the test records
# nothing until the edit is undone. To record a step again, delete it here.
# Keys and digests: scenarios-act-completes-login-form.lock.json

test: act completes Login Form
file: tests-agent/scenarios.e2e.ts

steps:
  - act: "Complete this scenario as the screen instructs: log in with the given username and password"
    params:
      password:
        kind: secret
        name: benchmark.password
        purpose: password
      username: tester@tester.army
    targets:
      android-emulator:
        at: dev.e2e.benchmark
        do:
          - type: tester@tester.army
            into: { role: textbox, name: Email, testId: email-input, placeholder: Email, selector: id=email-input, within: Use tester@tester.army / <secret:benchmark.password> }
          - secret: benchmark.password
            into: { role: textbox, name: Password, testId: password-input, placeholder: Password, selector: id=password-input, inputPurpose: password, within: Use tester@tester.army / <secret:benchmark.password> }
          - tap: { role: group, name: Log in, testId: login-button, selector: id=login-button, within: Use tester@tester.army / <secret:benchmark.password> }
        expect:
          shows:
            - { role: text, name: Logged in successfully, testId: success-message }
            - { role: text, name: Log out }
            - { role: group, name: Log out, testId: logout-button }
          gone:
            - { role: text, name: Use tester@tester.army / <secret:benchmark.password> }
            - { role: textbox, name: Email, testId: email-input, placeholder: Email }
            - { role: textbox, name: Password, testId: password-input, placeholder: Password, inputPurpose: password }
            - { role: text, name: Log in }
            - { role: group, name: Log in, testId: login-button }
      ios-simulator:
        at: dev.e2e.benchmark / Login Form
        do:
          - type: tester@tester.army
            into: { role: textbox, testId: email-input, placeholder: Email, selector: id=email-input }
          - secret: benchmark.password
            into: { role: textbox, testId: password-input, placeholder: Password, selector: id=password-input, inputPurpose: password }
          - tap: { role: other, name: Log in, testId: login-button, selector: id=login-button }
          - press: Enter
            on: { role: textbox, testId: password-input, placeholder: Password, selector: id=password-input, inputPurpose: password }
          - tap: { role: other, name: Log in, testId: login-button, selector: id=login-button }
          - tap: { role: button, name: Not Now }
        expect:
          shows:
            - { role: other, name: Log out, testId: logout-button }
            - { role: text, name: Logged in successfully, testId: success-message }
          gone:
            - { role: textbox, testId: email-input, placeholder: Email, value: Email }
            - { role: textbox, testId: password-input, placeholder: Password, inputPurpose: password }
            - { role: other, name: Log in, testId: login-button }
            - { role: text, name: Use tester@tester.army / <secret:benchmark.password> }
