# Replay recording of one e2e test. Review it like code: each step lists what
# a replay does (do) and what it checks before the step passes (expect).
# Don't edit it: an edited recording no longer replays, and the test records
# nothing until the edit is undone. To record a step again, delete it here.
# Keys and digests: scenarios-act-completes-flattened-login.lock.json

test: act completes Flattened Login
file: tests-agent/scenarios.e2e.ts

steps:
  - act: "Complete this scenario as the screen instructs: log in with the email and password the screen shows as a hint. The screen lists nothing useful; take a screenshot and work from it."
    targets:
      android-emulator:
        at: dev.e2e.benchmark
        do:
          - runtimeValue: pixels
          - runtimeValue: pixels
          - tap: { role: group, name: SIGN IN, within: Use tester@tester.army / <secret:benchmark.password> }
        expect:
          shows:
            - { role: text, name: Logged in successfully }
          gone:
            - { role: text, name: Use tester@tester.army / <secret:benchmark.password> }
            - { role: text, name: Email }
            - { role: text, name: Password }
            - { role: text, name: SIGN IN }
            - { role: group, name: SIGN IN }
      ios-simulator:
        at: dev.e2e.benchmark / Flattened Login
        do:
          - tapAt: { x: 178, y: 450 }
            viewport: 402x874
            on: { role: other, name: "Use tester@tester.army / <secret:benchmark.password>, Email, Password, SIGN IN" }
            offset: [ 0.4428, 0.4406 ]
          - runtimeValue: pixels
          - tapAt: { x: 191, y: 532 }
            viewport: 402x874
            on: { role: other, name: "Use tester@tester.army / <secret:benchmark.password>, Email, Password, SIGN IN" }
            offset: [ 0.4751, 0.5488 ]
          - runtimeValue: pixels
          - tapAt: { x: 181, y: 533 }
            viewport: 402x874
            on: { role: other, name: "Use tester@tester.army / <secret:benchmark.password>, Email, Password, SIGN IN" }
            offset: [ 0.4502, 0.5501 ]
          - tap: { role: button, name: return, testId: Return, selector: id=Return }
          - tapAt: { x: 199, y: 596 }
            viewport: 402x874
            on: { role: other, name: "Use tester@tester.army / <secret:benchmark.password>, Email, Password, SIGN IN" }
            offset: [ 0.495, 0.6332 ]
          - tap: { role: button, name: Not Now }
        expect:
          shows:
            - { role: other, name: Logged in successfully }
          gone:
            - { role: other, name: "Use tester@tester.army / <secret:benchmark.password>, Email, Password, SIGN IN" }
