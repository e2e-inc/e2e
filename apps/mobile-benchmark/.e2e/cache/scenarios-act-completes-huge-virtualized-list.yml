# Replay recording of one e2e test. Review it like code: each step lists what
# a replay does (do) and what it checks before the step passes (expect).
# Don't edit it: an edited recording no longer replays, and the test records
# nothing until the edit is undone. To record a step again, delete it here.
# Keys and digests: scenarios-act-completes-huge-virtualized-list.lock.json

test: act completes Huge Virtualized List
file: tests-agent/scenarios.e2e.ts

steps:
  - act: "Complete this scenario as the screen instructs: scroll to Row 0512 and tap it; the list has 600 rows and off-screen rows are not in the tree"
    targets:
      android-emulator:
        at: dev.e2e.benchmark
        do:
          - scroll: down
            until: Row 0512
          - tap: { role: group, name: Row 0512, testId: row-512, selector: id=row-512 }
        expect:
          shows:
            - { role: text, name: Found Row 0512, testId: success-message }
          gone:
            - { role: text, name: All 600 rows are loaded. Scroll to Row 0512 and tap it. }
            - { role: text, name: Row 0001 }
            - { role: text, name: Row 0002 }
            - { role: text, name: Row 0003 }
            - { role: text, name: Row 0004 }
            - { role: text, name: Row 0005 }
            - { role: text, name: Row 0006 }
            - { role: text, name: Row 0007 }
