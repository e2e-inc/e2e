name: util native

# @e2e-dev/util's native addon for every platform its platform packages ship
# (`util` in scripts/native/addons.ts), each built on a runner of that OS and,
# for Linux, that architecture, then checked (scripts/native/check-build.ts:
# format, architecture, C library, glibc floor) and loaded in that platform's
# Node, the Intel Mac build under Rosetta. Each build is uploaded as the
# artifact `util-native-<platform>`.
#
# Called by spec.yml, so every pull request builds and loads all eight; by
# release.yml, whose publishing jobs put the artifacts in the platform
# packages (scripts/native/place-native.ts); and by examples.yml, whose
# examples install those packages.
#
# The glibc builds run on Ubuntu 22.04, so they need glibc 2.35 or later; the
# musl builds run in an Alpine container on a runner of their architecture.
# The Windows builds run on GitHub-hosted runners, the arm64 one on its own.
on:
  workflow_call:

permissions:
  contents: read

env:
  # The Node the musl builds compile and load in; Alpine's musl is the one they link.
  ALPINE_NODE: node:26-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, target: aarch64-apple-darwin, runner: blacksmith-6vcpu-macos-26 }
          # No Intel Mac runner is in use: an arm64 Mac cross-builds it and loads it under Rosetta.
          - { platform: darwin-x64, target: x86_64-apple-darwin, runner: blacksmith-6vcpu-macos-26, rosetta: true }
          - { platform: linux-x64-gnu, target: x86_64-unknown-linux-gnu, runner: blacksmith-4vcpu-ubuntu-2204 }
          - { platform: linux-arm64-gnu, target: aarch64-unknown-linux-gnu, runner: blacksmith-4vcpu-ubuntu-2204-arm }
          - { platform: linux-x64-musl, target: x86_64-unknown-linux-musl, runner: blacksmith-4vcpu-ubuntu-2404, alpine: true }
          - { platform: linux-arm64-musl, target: aarch64-unknown-linux-musl, runner: blacksmith-4vcpu-ubuntu-2404-arm, alpine: true }
          - { platform: win32-x64-msvc, target: x86_64-pc-windows-msvc, runner: windows-latest }
          - { platform: win32-arm64-msvc, target: aarch64-pc-windows-msvc, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # build-native.ts is TypeScript run directly, which needs a Node newer than a runner image may ship.
      - if: ${{ !matrix.alpine }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - if: ${{ !matrix.alpine }}
        uses: ./.github/actions/rust-toolchain
      - name: Build
        if: ${{ !matrix.alpine }}
        run: |
          node scripts/native/build-native.ts util --target "${{ matrix.target }}"
          node scripts/native/check-build.ts util "${{ matrix.target }}"
      - name: Build in Alpine
        if: ${{ matrix.alpine }}
        run: docker run --rm -v "$PWD:/work" -w /work "$ALPINE_NODE" sh .github/scripts/build-musl.sh util "${{ matrix.target }}"
      - name: Load the addon
        if: ${{ !matrix.alpine && !matrix.rosetta }}
        run: node scripts/native/probe-util.ts "packages/util/util.${{ matrix.platform }}.node"
      - name: Load the addon in Alpine
        if: ${{ matrix.alpine }}
        run: docker run --rm -v "$PWD:/work" -w /work "$ALPINE_NODE" node scripts/native/probe-util.ts "packages/util/util.${{ matrix.platform }}.node"
      - if: ${{ matrix.rosetta }}
        uses: ./.github/actions/load-x64-addon
        with:
          addon: packages/util/util.${{ matrix.platform }}.node
          probe: scripts/native/probe-util.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: util-native-${{ matrix.platform }}
          path: packages/util/util.${{ matrix.platform }}.node
          if-no-files-found: error
          retention-days: 3
