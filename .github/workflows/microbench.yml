name: microbench

# Instruction counts of the runner's small pure-JS functions under Valgrind
# (scripts/microbench.ts). Not a gate: no ruleset requires it, so the
# workflow-level `paths:` filter is safe here, unlike in the gated workflows.
#
# `repeatability` measures one build against itself in JIT and jitless mode
# and fails when a case reports a direction anyway: it is the evidence that
# a count is stable enough to compare. `compare` measures the pull request's
# base against its head (or a dispatched base ref against the branch).
#
# A pull request runs it when it changes the harness, the code the cases
# measure (`scripts/microbench/cases.mjs` loads it from packages/core and
# packages/mobile), or the captured snapshots the cases read as input.
on:
  pull_request:
    paths:
      - scripts/microbench.ts
      - scripts/microbench/**
      - .github/workflows/microbench.yml
      - packages/core/src/**
      - packages/mobile/src/**
      - packages/mobile/tests/fixtures/snapshots/**
  workflow_dispatch:
    inputs:
      base:
        description: Ref to compare the branch against (empty runs only the repeatability check)
        type: string
        default: ''
      trials:
        description: Trials per case, mode, and checkout
        type: string
        default: '10'
      mode:
        description: jit, jitless, or both
        type: string
        default: both

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_TELEMETRY_DISABLED: '1'
  # Tiering heuristics change between V8 versions, so every count here comes
  # from one exact Node. Bumping it steps every case; say so in the PR.
  MICROBENCH_NODE: 26.13.1

jobs:
  repeatability:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.MICROBENCH_NODE }}
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: pnpm install --frozen-lockfile
      - name: Build the measured packages
        run: |
          pnpm --filter @e2e-dev/core run build
          pnpm --filter e2e run build
          pnpm --filter @e2e-dev/mobile run build
      - name: Measure one build against itself
        env:
          TRIALS: ${{ inputs.trials || '10' }}
          MODE: ${{ inputs.mode || 'both' }}
        run: node scripts/microbench.ts --base-root . --mode "$MODE" --trials "$TRIALS" --out "$RUNNER_TEMP/microbench"
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microbench-repeatability
          path: ${{ runner.temp }}/microbench
          if-no-files-found: ignore

  compare:
    if: ${{ github.event_name == 'pull_request' || inputs.base != '' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.MICROBENCH_NODE }}
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Check out and build both revisions
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: |
          base="$(git merge-base "$(git rev-parse --verify "$BASE_REF^{commit}")" HEAD)"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          for root in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/base"; do
            (
              cd "$root"
              pnpm install --frozen-lockfile
              pnpm --filter @e2e-dev/core run build
              pnpm --filter e2e run build
              pnpm --filter @e2e-dev/mobile run build
            )
          done
      - name: Measure base against head
        env:
          TRIALS: ${{ inputs.trials || '5' }}
          MODE: ${{ inputs.mode || 'both' }}
        run: node scripts/microbench.ts --base-root "$RUNNER_TEMP/base" --mode "$MODE" --trials "$TRIALS" --out "$RUNNER_TEMP/microbench"
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microbench-compare
          path: ${{ runner.temp }}/microbench
          if-no-files-found: ignore
