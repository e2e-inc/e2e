name: docs translations

# Checks the translated docs sections a pull request changes against DeepL
# (scripts/check-docs-translations-deepl.ts), including the translations an
# English edit leaves stale. A flagged section gets a warning on its heading
# and a row in the job summary; the job fails only when DeepL cannot be
# reached. Advisory, so it is not a required check and filters by path here
# instead of through a gate job. e2e-inc/e2e-site checks its UI copy the same way.
on:
  pull_request:
    paths:
      - 'docs/**/*.mdx'
      - 'docs/ja/README.md'
      - 'scripts/deepl-review.ts'
      - 'scripts/check-docs-translations-deepl.ts'
      - '.github/workflows/docs-translations.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deepl:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      # The full history holds the PR base the check diffs against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The script has no dependencies: Node runs its TypeScript as is.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # A fork's pull request has no DEEPL_API_KEY; the check then skips.
      - name: Check the Japanese docs against DeepL
        run: node scripts/check-docs-translations-deepl.ts --base origin/${{ github.base_ref }}
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
